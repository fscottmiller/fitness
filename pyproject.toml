[project]
name = "prengine"
version = "0.1.0"
description = "PR Engine - a single-athlete training API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<0.117",
    "uvicorn>=0.35,<0.36",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.16,<2",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "fastmcp>=2,<3",
    "python-ulid>=3.0,<4",
    "httpx>=0.28,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "mypy>=1.18,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Lint/format/coverage configuration lands with the test-harness issue; typing is
# here so the skeleton starts type-clean rather than being retrofitted.
strict = true
# Without the plugin, mypy reads BaseSettings fields as required constructor
# arguments and flags `Settings()`.
plugins = ["pydantic.mypy"]
